server:
  port: 8081
spring:
  application:
    name: SpringBoot

  datasource:
    url: jdbc:mysql://localhost:3306/testing_system
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
  web:
    error:
      include-message: always
      include-binding-errors: always

